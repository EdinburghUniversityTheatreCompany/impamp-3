# Name of your application. Used to uniquely configure containers.
service: impamp-3

# Name of the container image.
image: mickzijdel/impamp-3

# Deploy to these servers.
#
# ONE HOST ONLY. The SSE change-notification bus (src/lib/server/events.ts) is
# in-process, so a second host would serve viewers who never receive change
# events raised on the other one. The failure is soft — the periodic sync still
# runs — so it presents as "notifications are sometimes slow" rather than as an
# outage, which is exactly why it is worth writing down here rather than only
# in docs/server-sync.md. Kamal cannot assert this; this comment is the control.
servers:
  web:
    - 87.106.35.121
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Remove this section when using multiple web servers and ensure you terminate SSL at your load balancer.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  host: impamp.bedlamtheatre.co.uk
  # Proxy connects to your container on port 80 by default.
  app_port: 3000

# Credentials for your image host.
registry:
  # Specify the registry server, if you're not using Docker Hub
  server: ghcr.io
  username: mickzijdel

  # Always use an access token rather than real password (pulled from .kamal/secrets).
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64
  # Pass in additional build args needed for your Dockerfile.
  args:
    # NEXT_PUBLIC_* values are inlined into the client bundle at BUILD time, so
    # they belong here and nowhere else. The API key used to sit in env.clear
    # below, which reaches the running container and never the browser — the
    # Drive Picker was rendered with developer-key={undefined}.
    NEXT_PUBLIC_GOOGLE_CLIENT_ID: <%= ENV["NEXT_PUBLIC_GOOGLE_CLIENT_ID"] %>
    NEXT_PUBLIC_GOOGLE_API_KEY: <%= ENV["NEXT_PUBLIC_GOOGLE_FILE_PICKER_API_KEY"] %>
    # No value is configured for this anywhere — not in .env.dist, not in
    # fnox.toml. The Picker's app-id is the Cloud project number. Set it and the
    # picker gets one; leave it and behaviour is exactly as it has been.
    NEXT_PUBLIC_GOOGLE_APP_ID: <%= ENV["NEXT_PUBLIC_GOOGLE_APP_ID"] %>
  #   RUBY_VERSION: <%= ENV["RBENV_VERSION"] || ENV["rvm_ruby_string"] || "#{RUBY_ENGINE}-#{RUBY_ENGINE_VERSION}" %>

# Inject ENV variables into containers (secrets come from .kamal/secrets or .kamal/env files).
#
env:
  # clear:
  #   DB_HOST: 192.168.0.2
  clear:
    NEXT_PUBLIC_GOOGLE_CLIENT_ID: $NEXT_PUBLIC_GOOGLE_CLIENT_ID
    # NEXT_PUBLIC_GOOGLE_API_KEY is NOT here: a NEXT_PUBLIC_* value is baked
    # into the client bundle when the image is built, so setting it on the
    # container has no effect. It moved to builder.args above.
    # Server-sync database, on the persistent volume declared below.
    IMPAMP_DB_PATH: /data/impamp.db
    # Who may hold a server-sync account. UNSET MEANS ANY Google account can
    # sign in and store profiles — set this before exposing server sync on a
    # public host. Accepts addresses and @domain suffixes, comma-separated.
    # IMPAMP_ALLOWED_EMAILS: "@bedlamtheatre.co.uk"
    #
    # Optional server-hosted audio (Wasabi). All five must be set together or
    # hosting stays off and audio syncs through Google Drive as usual. Even
    # then, no account can upload until an admin approves it at
    # /server/storage. See docs/wasabi-audio.md — the bucket also needs a CORS
    # policy, and must stay private.
    IMPAMP_S3_ENDPOINT: https://s3.eu-west-1.wasabisys.com
    IMPAMP_S3_REGION: eu-west-1
    IMPAMP_S3_BUCKET: impamp-audio
    #
    # Limits, with their defaults: 100 GiB across everyone, 2 GiB each,
    # 100 MB per file.
    # IMPAMP_AUDIO_GLOBAL_CAP_BYTES: "107374182400"
    IMPAMP_AUDIO_USER_QUOTA_BYTES: "5368709120"
    # IMPAMP_AUDIO_MAX_OBJECT_BYTES: "104857600"
  secret:
    - GOOGLE_CLIENT_SECRET
    - GOOGLE_API_KEY
    # Wasabi keys, for server-hosted audio. .kamal/secrets holds only
    # $-references, so the values never enter a committed file.
    - IMPAMP_S3_ACCESS_KEY_ID
    - IMPAMP_S3_SECRET_ACCESS_KEY
    # - RAILS_MASTER_KEY

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal app logs -r job" will tail logs from the first server in the job section.
#
# aliases:
#   shell: app exec --interactive --reuse "bash"

# Use a different ssh user than root
#
ssh:
  user: deploy

# Use a persistent storage volume.
#
# Holds the server-sync SQLite database (users, profiles, shares, sessions).
# It must survive deploys — losing it unlinks every server-synced profile,
# though nothing in it is the only copy of a soundboard: profile data also
# lives in each collaborator's IndexedDB and their audio stays in Drive.
#
# Back it up with a consistent copy rather than `cp` (WAL is in play). Run it
# on the host, not through `kamal app exec`: the app image is node:alpine and
# has no sqlite3 binary, so the command this used to name could never have run
# — which would have been discovered at the worst possible moment.
#
#   docker run --rm -v impamp_data:/data -v "$PWD:/backup" alpine \
#     sh -c 'apk add --no-cache sqlite && \
#            sqlite3 /data/impamp.db ".backup /backup/impamp-$(date +%F).db"'
#
# THAT IS ONLY HALF THE BACKUP. Server-hosted audio is on below
# (IMPAMP_S3_BUCKET), so the bucket holds the only copy of those sounds and the
# two must be captured and restored together — rows without objects leave pads
# pointing at nothing. Run the database copy FIRST, then mirror the bucket with
# a command that never deletes:
#
#   rclone copy wasabi:impamp-audio /backup/impamp-audio --transfers 8
#
# The order is not arbitrary and the `copy`-not-`sync` is not a preference;
# docs/wasabi-audio.md's "Backups" section explains why each is the only safe
# choice, and gives the reconciliation query to check a restore.
#
# The container runs as uid 1000 (`node`) rather than root. A volume created
# from this image onwards already lands owned by 1000, but a volume that
# predates that change is still owned by root, and the app cannot write to it.
# Chown it once, on the host, before the first deploy of that change:
#   docker run --rm -v impamp_data:/data alpine chown -R 1000:1000 /data
volumes:
  - "impamp_data:/data"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
#
# asset_path: /app/public/assets

# Configure rolling deploys by setting a wait time between batches of restarts.
#
# boot:
#   limit: 10 # Can also specify as a percentage of total hosts, such as "25%"
#   wait: 2

