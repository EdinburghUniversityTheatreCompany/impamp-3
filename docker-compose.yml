services:
  # Main application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Required, and not merely nice to have: `useGoogleLogin` runs during
        # prerender, so an unset OR empty value fails `next build` outright with
        # a stack trace in /_not-found that names nothing about configuration.
        # Nothing passed this, so `docker compose up app` could not build the
        # image at all. Real Drive sign-in needs a real client id — put it in a
        # local .env (see .env.dist), which compose loads automatically — but a
        # placeholder is enough for everything that is not Google sign-in.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-unset.apps.googleusercontent.com}
        # The Drive Picker's developer key and app id. Both are inlined into the
        # client bundle at build time like the client id above, so they must be
        # build args; left unset, the Picker renders without them, which is what
        # every compose build did before these two lines existed.
        NEXT_PUBLIC_GOOGLE_API_KEY: ${NEXT_PUBLIC_GOOGLE_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_APP_ID: ${NEXT_PUBLIC_GOOGLE_APP_ID:-}
    image: impamp3:latest
    container_name: impamp3-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3025}:3000" # Map to host port specified by HOST_PORT env var (default: 3025)
    environment:
      - NODE_ENV=production
      - IMPAMP_DB_PATH=/data/impamp.db
    # Everything else the server reads — GOOGLE_CLIENT_SECRET, GOOGLE_API_KEY,
    # NEXT_PUBLIC_GOOGLE_CLIENT_ID, IMPAMP_ALLOWED_EMAILS, the five IMPAMP_S3_*
    # and the IMPAMP_AUDIO_* limits; config/deploy.yml is the full list. A
    # Portainer stack writes its environment variables to stack.env beside this
    # file, but interpolation only fills ${...} placeholders: without this, not
    # one of them reached the container, so sign-in, hosted audio and the signup
    # allowlist were silently off. Only variables that are actually set arrive,
    # so an unset IMPAMP_ALLOWED_EMAILS stays unset rather than becoming "".
    # Optional, so a plain local `docker compose up app` still works without one.
    env_file:
      - path: stack.env
        required: false
    volumes:
      # Server-sync SQLite database — must outlive the container.
      - impamp_data:/data
    # CLAUDE.md advertises the /up health endpoint and src/app/up/route.ts
    # implements it, but nothing asked the container about it: `docker compose ps`
    # reported a wedged app as healthy.
    #
    # The URL uses $HOSTNAME, not localhost, and that is not a style choice.
    # Next's standalone server binds the address in HOSTNAME, which Docker sets to
    # the container id — so it listens on the container IP alone and a request to
    # localhost or 127.0.0.1 inside the container is refused outright. Verified:
    # both spellings of loopback give "fetch failed"; $HOSTNAME gives 200. (From
    # the host, published ports work either way, which is what hides this.)
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://'+process.env.HOSTNAME+':3000/up').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Development service with hot-reloading
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: impamp3-dev:latest
    container_name: impamp3-dev
    profiles: ["development"] # Only start when the "development" profile is active
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${DEV_PORT:-3000}:3000" # Map to host port specified by DEV_PORT env var (default: 3000)
    environment:
      - NODE_ENV=development
      - IMPAMP_DB_PATH=/app/data/impamp.db
    command: npm run dev

volumes:
  impamp_data:
