# Actions are pinned to a commit SHA with the release tag in a trailing comment (supply-chain
# safety — see the github-actions skill's security-checklist.md). Bump with `pinact run -u` and
# verify with scripts/check_action_refs.sh (see SKILL.md › "Keeping GitHub Actions current").
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger, which is also the only thing that runs the cross-browser
  # e2e job — see the note above it.
  workflow_dispatch:

# Default GITHUB_TOKEN to read-only; a job needing more declares its own permissions: block.
permissions:
  contents: read

# One pipeline per ref. Two pushes in quick succession otherwise run two complete
# pipelines — including two chromium e2e jobs and now two image builds — and the
# older one's result is discarded anyway. Cancelled on pull_request, where only the
# tip matters; NOT on push, so a run against a commit on main always completes and
# main keeps an unbroken record of which commits were green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Check formatting (prettier)
        run: npx prettier --check .
      - name: Executable bits on shipped scripts
        # Any tracked file whose first line is a shebang must be mode 100755 in the
        # index — with core.fileMode=false a local chmod never reaches git, and a
        # 100644 script dies with exit 126 on every fresh clone.
        # Mirrors the hk `exec-bit-scripts` step so CI and pre-commit agree.
        run: |
          bad=$(git ls-files -s | awk -F'\t' '$1 ~ /^100644/ { if ((getline line < $2) > 0 && line ~ /^#!/) print $2; close($2) }')
          if [ -n "$bad" ]; then
            echo "Shebang scripts missing the executable bit in the git index. Fix: git update-index --chmod=+x <file>"
            echo "$bad"
            exit 1
          fi

  # Toolchain + service versions are pinned in several files at once (mise.toml, the
  # .<lang>-version files, the Dockerfile ARGs, and the compose/deploy `image:` tags) because
  # different consumers read different ones, and nothing makes them agree — a bump that misses
  # one file is silent. Mirrors the hk `versions` step so the gates can't drift. Reads files
  # only, so it needs no toolchain: the cheapest job in this workflow.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain and service versions agree across files
        run: bash scripts/check_version_sync.sh
      - name: Every Dockerfile pins the same Node
        # check_version_sync.sh is a shared template that inspects only the
        # first of Dockerfile / Containerfile, so Dockerfile.dev's pin was
        # unguarded — the dev container ran a different Node major from CI for
        # months. Mirrors the hk `extra-dockerfiles` step.
        run: bash scripts/check_extra_dockerfiles.sh

  # Run the MIT-licensed gitleaks CLI (via mise, version-pinned in mise.lock) rather than
  # gitleaks/gitleaks-action: the action requires a paid GITLEAKS_LICENSE on org-owned repos,
  # while the CLI is free for all repos and is exactly what the local hk pre-commit hook runs.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks git scans the full commit history
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Scan git history for secrets
        run: mise exec -- gitleaks git --redact --no-banner .

  # GitHub Actions workflow checks — mirrors the hk `actionlint` + `zizmor` steps. One job runs
  # both over the workflow files: actionlint (schema/expression/`needs:` correctness; its
  # shellcheck-of-run: pass is off, see the hk step) then zizmor (security — credential
  # persistence, template injection, over-broad GITHUB_TOKEN, …; offline audits only, no token).
  actions-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Lint workflows (actionlint)
        run: actionlint -shellcheck=
      - name: Scan workflows with zizmor
        run: zizmor --no-progress .github/workflows/

  # Vitest unit/integration suite — the server-sync storage layer, API route
  # handlers and client sync loop. Seconds to run, so it is its own job and
  # gates the pipeline.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run unit tests (vitest)
        run: npm test
      - name: Lint (eslint)
        run: npm run lint

  # Playwright end-to-end suite. Chromium only for now: the Firefox and WebKit
  # projects have not been run green yet, so gating on them would land a red
  # pipeline (see the "known failures" note in e2e-tests/README.md).
  #
  # playwright.config.ts serves a production build rather than `next dev` —
  # on-demand Turbopack compilation was the source of this suite's timeouts and
  # all of its flakiness.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npx playwright test --project=chromium
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Firefox and WebKit — ON DEMAND ONLY. This job does not run on push or PR.
  #
  # Both were run to completion and triaged; see docs/cross-browser-e2e.md.
  # Neither red run reflects a bug a user would hit:
  #
  #   webkit  — Playwright's Linux WebKit build cannot write ANY Blob to
  #             IndexedDB, so no pad ever gets a sound and 38 tests cascade.
  #             Released Safari has no such problem.
  #   firefox — 64/64 green on a developer machine. The 17 CI failures are all
  #             "playback never starts", because the runner has no audio device.
  #
  # Since both are known-red for reasons outside the app, running them every
  # push cost ~35 minutes of Actions time for no signal anyone acts on. They
  # are kept, rather than deleted, because they are worth running deliberately
  # — after a dependency upgrade, or when touching storage or playback.
  #
  # To run: Actions → ci → "Run workflow" (workflow_dispatch), or
  # `gh workflow run ci`. Locally: `npx playwright test --project=webkit`.
  #
  # Do not delete `continue-on-error` expecting a green gate. Read that doc
  # first — making either one gate means changing the app's storage schema or
  # the runner's audio setup, not fixing a test.
  e2e-cross-browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    # These jobs normally take 12–21 minutes. On 2026-08-14 the WebKit one hung
    # instead, and because `continue-on-error` means it cannot fail the run, it
    # would have sat there until GitHub's 6-hour default killed it — burning
    # Actions minutes and holding the run `in_progress`, which also keeps every
    # other job's logs unreadable. 30 minutes is generous headroom over the
    # slowest real run; anything past it is a hang, not slowness.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Run e2e tests (${{ matrix.browser }})
        run: npx playwright test --project="$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  # Build and smoke-test the production image — the artefact that actually ships.
  #
  # Nothing in this pipeline used to touch it: `kamal deploy` builds locally on the
  # operator's machine, so a broken Dockerfile or .dockerignore was discovered mid-deploy,
  # on the deploying machine, with the running site already being replaced. Both failure
  # modes have happened. The .dockerignore rewrite dropped playwright.config.ts while
  # keeping e2e-tests/ out, which fails `next build` at the type-check step; and the image
  # created /data but never set IMPAMP_DB_PATH, so every server-sync route 500'd with
  # EACCES on /app/data under the README's own `docker run`.
  #
  # Hence a build AND a run: a green build would not have caught the second one. No buildx
  # or registry cache, deliberately — it would mean pinning more third-party actions for a
  # job that takes a few minutes, and this needs to be the least trusted-code path here.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=ci-placeholder -t impamp3:ci .
      - name: Boot it the way README.md documents, with no volume and no env
        run: docker run -d --name impamp-ci -p 3000:3000 impamp3:ci
      - name: Wait for the health endpoint
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS localhost:3000/up >/dev/null 2>&1; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "never became healthy"
          docker logs impamp-ci
          exit 1
      - name: The server-sync database must open
        # getDb() is reached only from route handlers, so an unwritable database
        # leaves the soundboard loading perfectly while every API call 500s —
        # which is why this asserts a real route and not just /up. This request
        # needs no session, and 404 is the correct answer for a profile that does
        # not exist. A 500 here means the app cannot open its own database.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3000/api/profiles/1?token=ci')
          echo "status=$code"
          if [ "$code" = "500" ]; then
            echo "The container cannot open its database."
            docker logs impamp-ci
            exit 1
          fi
      - name: No permission errors in the log
        run: |
          if docker logs impamp-ci 2>&1 | grep -q EACCES; then
            docker logs impamp-ci
            exit 1
          fi
      - name: Stop the container
        if: always()
        run: docker rm -f impamp-ci || true

  # Noisier audits — mirror the hk `check` hook.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: npm ci
      - name: Known vulnerabilities (npm audit)
        # The job was called `audit` and audited nothing but duplication and
        # file sizes. Production dependencies only and high-or-worse, so a dev
        # tool's advisory does not block a deploy but a shipped one does.
        run: npm audit --omit=dev --audit-level=high
      - name: Pinned action refs
        # The header of this file has always said to verify with this script.
        # It did not exist, which is very likely why three actions had drifted
        # to two different SHAs each.
        run: bash scripts/check_action_refs.sh
      - name: Duplication (jscpd)
        # -f scopes to code formats; .jscpd.json carries minTokens/threshold/reporters/ignore.
        # Runner + version policy (latest on a 4-day cooldown, floored at v5 — see
        # SKILL.md › jscpd version policy) are shared with the hk pre-commit gate via
        # scripts/run-jscpd.sh; --require keeps CI strict (unrunnable jscpd fails the job).
        run: bash scripts/run-jscpd.sh --require javascript,typescript,css,scss
      - name: Large files
        run: |
          limit=512000
          # docs/original-impamp-code.txt is an intentional full-text reference dump of
          # the legacy ImpAmp2 codebase (kept for the V1 import/migration logic), not a
          # binary or build artifact — exempt it from the accidental-large-file check.
          large=$(git ls-files | while read -r f; do
            [ "$f" = "docs/original-impamp-code.txt" ] && continue
            s=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$s" -gt "$limit" ]; then echo "$f ($s bytes)"; fi
          done)
          if [ -n "$large" ]; then echo "Files exceed ${limit} bytes:"; echo "$large"; exit 1; fi
